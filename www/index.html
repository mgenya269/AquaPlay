<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaPlay — игры о воде</title>
<meta name="theme-color" content="#0ea5e9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjMyIiBmaWxsPSIjMDcxYTJmIi8+PHRleHQgeD0iOTYiIHk9IjEzMCIgZm9udC1zaXplPSIxMTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiPvCfjIo8L3RleHQ+PC9zdmc+">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e0f2ff;
    background: radial-gradient(ellipse at top, #0d3355 0%, #071a2f 60%);
    min-height: 100vh;
    padding: 40px 20px;
  }
  header { text-align: center; margin-bottom: 40px; }
  .logo {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 800;
    background: linear-gradient(90deg, #7dd3fc, #38bdf8, #0ea5e9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { color: #94a3b8; margin-top: 8px; }
  main { max-width: 1000px; margin: 0 auto; }
  .section-title {
    font-size: 1.1rem;
    color: #38bdf8;
    margin: 30px 0 16px;
    font-weight: 700;
  }
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .game-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(13,40,71,.75);
    border: 1px solid #1e4976;
    border-radius: 18px;
    padding: 24px;
    transition: transform .25s, border-color .25s, box-shadow .25s;
    position: relative;
  }
  .game-card:hover {
    transform: translateY(-4px);
    border-color: #38bdf8;
    box-shadow: 0 12px 40px rgba(56,189,248,.18);
  }
  .game-emoji { font-size: 2.6rem; display: block; margin-bottom: 12px; }
  .game-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
  .game-desc { font-size: .9rem; color: #94a3b8; margin-bottom: 16px; }
  .badge {
    display: inline-block;
    font-size: .72rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    background: rgba(245,158,11,.15);
    color: #f59e0b;
    border: 1px solid rgba(245,158,11,.4);
  }
  .record-badge {
    position: absolute;
    top: 16px; right: 16px;
    font-size: .75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(34,197,94,.15);
    color: #22c55e;
    border: 1px solid rgba(34,197,94,.4);
  }
  .achievements-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .ach {
    background: rgba(13,40,71,.5);
    border: 1px solid #1e4976;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    opacity: .4;
    transition: opacity .2s;
  }
  .ach.unlocked {
    opacity: 1;
    border-color: rgba(250,204,21,.5);
    background: rgba(250,204,21,.08);
  }
  .ach-icon { font-size: 1.8rem; display: block; margin-bottom: 6px; }
  .ach-name { font-size: .78rem; color: #cbd5e1; }
  .ach.unlocked .ach-name { color: #facc15; font-weight: 700; }
  footer {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
    font-size: .85rem;
    margin-top: 40px;
    border-top: 1px solid #1e4976;
  }
  footer a { color: #38bdf8; text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="logo">🌊 AquaPlay</div>
  <p class="tagline">Интерактивные игры о воде и гидрологии</p>
</header>

<main>
  <h2 class="section-title">🎮 Игры</h2>
  <div class="games-grid">
    <a class="game-card" href="games/water-balance/index.html">
      <span class="game-emoji">🌊</span>
      <h3 class="game-title">Водный Баланс</h3>
      <p class="game-desc">Управляй шлюзом плотины и держи уровень воды в норме.</p>
      <span class="badge">Играть</span>
      <span class="record-badge" id="wbRecord" style="display:none"></span>
    </a>
  </div>

  <h2 class="section-title">🏆 Достижения</h2>
  <div class="achievements-grid" id="achGrid"></div>
</main>

<footer>
  💧 <strong>AquaPlay</strong> ·
  <a href="https://github.com/Yudzhen">Yudzhen</a> ·
  MIT License
</footer>

<script>
  const ACHIEVEMENTS = [
    { id: 'first_run',  icon: '🎮', name: 'Первый запуск' },
    { id: 'score_100',  icon: '💯', name: '100 очков' },
    { id: 'score_500',  icon: '🔥', name: '500 очков' },
    { id: 'score_1000', icon: '👑', name: '1000 очков' },
    { id: 'time_60',    icon: '⏱',  name: 'Минута в игре' },
    { id: 'combo_5',    icon: '⚡', name: 'Комбо ×5' },
    { id: 'level_3',    icon: '📈', name: 'Сложность 3' },
  ];

  try {
    const rec = localStorage.getItem('aquaplay_wb_record');
    if (rec !== null) {
      const el = document.getElementById('wbRecord');
      el.textContent = '🏆 ' + rec;
      el.style.display = 'inline-block';
    }

    const unlocked = JSON.parse(localStorage.getItem('aquaplay_wb_achievements') || '[]');
    const grid = document.getElementById('achGrid');
    grid.innerHTML = ACHIEVEMENTS.map(a => `
      <div class="ach ${unlocked.includes(a.id) ? 'unlocked' : ''}">
        <span class="ach-icon">${unlocked.includes(a.id) ? a.icon : '🔒'}</span>
        <span class="ach-name">${a.name}</span>
      </div>
    `).join('');
  } catch (e) {}

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
